<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>korb-m test client</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  input { font: inherit; padding: .4rem; }
  #url { width: 60%; }
  #msg { width: 75%; }
  button { font: inherit; padding: .4rem .8rem; }
  #log { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: .5rem; margin-top: 1rem;
         font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; }
  .in { color: #0a6; } .out { color: #06c; } .sys { color: #888; } .err { color: #c00; }
</style>
</head>
<body>
<h1>korb-m test client</h1>
<p>
  <input id="url" value="ws://localhost:8080/ws">
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
</p>
<form id="form">
  <input id="msg" placeholder="message" autocomplete="off" disabled>
  <button disabled>Send</button>
</form>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
let ws;

function log(text, cls) {
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  $("log").append(line);
  $("log").scrollTop = $("log").scrollHeight;
}

function setConnected(on) {
  $("connect").disabled = on;
  $("disconnect").disabled = !on;
  $("msg").disabled = !on;
  $("form").querySelector("button").disabled = !on;
}

$("connect").onclick = () => {
  ws = new WebSocket($("url").value);
  log(`connecting to ${ws.url}`, "sys");
  ws.onopen = () => { log("open", "sys"); setConnected(true); $("msg").focus(); };
  ws.onmessage = e => log(`< ${e.data}`, "in");
  ws.onerror = () => log("error (see DevTools console)", "err");
  ws.onclose = e => {
    log(`closed: code=${e.code} reason="${e.reason}" clean=${e.wasClean}`, "sys");
    setConnected(false);
  };
};

$("disconnect").onclick = () => ws.close(1000, "bye");

$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("msg").value;
  if (!text) return;
  ws.send(text);
  log(`> ${text}`, "out");
  $("msg").value = "";
};
</script>
</body>
</html>
